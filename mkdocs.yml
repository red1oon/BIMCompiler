site_name: BIM Intent Compiler
site_url: https://red1oon.github.io/BIMCompiler/   # needed by the language chooser: without it the chooser's links are root-absolute (/es/), a 404 on this site (DOCS_I18N.md §6d)
site_description: Construction is manufacturing. A building IS its Bill of Materials.
site_author: Redhuan D. Oon
repo_url: https://github.com/red1oon/bim-ootb
repo_name: OOTB

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.link

docs_dir: docs

# Kept in the repo, OFF the public site: Java-era + stale specs (archive/) and
# current-but-too-technical dev docs (internal/). Excluded from the gh.io build.
exclude_docs: |
  internal/
  archive/
  ERP_PROJECT_REVIEW.md

# Published but deliberately off the menu: developer specs reached from DXF2BIMGuide's "For developers"
# line, and the generated Flow Row reference reached from DistributedERP.
not_in_nav: |
  OdooMigrationGuide.md
  BusinessCentralMigrationGuide.md
  DXF2BIM_SPEC.md
  DXF2BIM_BASIC_SHAPES_SPEC.md
  ReplicationFlowRows.md

markdown_extensions:
  - tables
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/fold-footnotes.js
  - javascripts/bim_compiler_source.js

extra:
  # Feedback box on every page (bim-compiler prompts/VOCAB_MESSAGE_CATALOG.md §19.21 item 5; owner 2026-11-24: "Need no counter. Allow anon readers.
  #   Feedback is good enough option"): giscus over this repo's GitHub Discussions. Anyone reads; posting needs a GitHub login. No server.
  #   enabled stays false until the giscus GitHub App is installed on red1oon/BIMCompiler (https://github.com/apps/giscus): before that the
  #   widget shows "giscus is not installed on this repository" (checked 2026-11-24 at https://giscus.app/api/discussions/categories).
  giscus:
    enabled: false
    repo: red1oon/BIMCompiler
    repo_id: R_kgDORA12Lg
    category: Announcements
    category_id: DIC_kwDORA12Ls4DL3LB
  analytics:
    provider: custom
    # GoatCounter — privacy-friendly, no cookies, GDPR compliant
    # Dashboard: https://red1oon.goatcounter.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/red1oon/bim-ootb
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/red1oon/

