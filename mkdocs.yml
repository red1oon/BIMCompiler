      - Home: index.md
      - "📖 User Guide": USER_GUIDE.md
      - About BIM OOTB: AboutMore.md
      - Feature Comparison: FeatureComparison.md
      - "Migrate & Compare (ERP)": MigrateComparisonPaper.md
      - "Benchmark Comparison (live)": bench_suite.html
      - "Does Your ERP Age? (live)": age_demo.html
      - The ERP World View: MANIFESTO.md
      - Contribute: CONTRIBUTING.md

  - The 3 Apps:
      - "BIM Viewer Guide": BIMUserGuide.md
      - "DAGeVu Modeller — User Guide": ModellerUserGuide.md
      - "DAGeVu Modeller Guide (toolbar index)": ModellerGuide.md
      - "Kernel-ERP User Guide": ERPUserGuide.md
      - "HR / Tenancy / Operate Module": HRBIMAssetGuide.md

  - Go Deeper:
      - "Fold Engine Black Book (dev manual)": FoldEngineBlackBook.html
      - "The Holy Grail (editable rules, live)": HolyGrail.md
      - "Cross-ERP Rosetta Stone (concept + cost)": ERPConceptRosetta.html
      - "BIM Modeller OOTB": BIM_Modeller_OOTB.md
      - "Spatial ERP — Every Record Has a Place": SpatialERP_OOTB.md
      - "Distributed ERP": DistributedERP.md
      - "Red Pill — Design From Grammar": RED_PILL.md
      - "Clash Detection": CLASH_DETECTION.md
      - "4D/5D Analysis": 4D5DAnalysis.md
      - "BIM → Project Order (ERP)": BIMtoProject.md
      - "Geometry as a Signed-Log Fold": ModellerKernelFold.md

  - Papers & Positioning:
      - "Construction Economy / ERP Wave": BIMERPPaper.md
      - "Enterprise Authentication (security)": EnterpriseAuthentication.md
      - "Strategic Positioning": StrategicIndustryPositioning.md
      - "Local-First Prior Art": LocalFirstPriorArt.md
