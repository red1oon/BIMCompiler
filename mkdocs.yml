site_name: BIM Intent Compiler
site_description: Construction is manufacturing. A building IS its Bill of Materials.
site_author: Redhuan D. Oon
repo_url: https://github.com/red1oon/bim-ootb

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.link

docs_dir: docs

# Kept in the repo, OFF the public site: Java-era + stale specs (archive/) and
# current-but-too-technical dev docs (internal/). Excluded from the gh.io build.
exclude_docs: |
  internal/
  archive/

markdown_extensions:
  - tables
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/fold-footnotes.js

extra:
  analytics:
    provider: custom
    # GoatCounter — privacy-friendly, no cookies, GDPR compliant
    # Dashboard: https://red1oon.goatcounter.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/red1oon/bim-ootb
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/red1oon/

nav:
