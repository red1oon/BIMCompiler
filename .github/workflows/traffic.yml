name: Traffic Stats

on:
  schedule:
    # Run every Monday at 00:00 UTC — captures the 14-day rolling window
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Collect traffic data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stats
          DATE=$(date -u +%Y-%m-%d)

          # Fetch current 14-day windows
          gh api repos/${{ github.repository }}/traffic/views > /tmp/views.json
          gh api repos/${{ github.repository }}/traffic/clones > /tmp/clones.json
          gh api repos/${{ github.repository }}/traffic/popular/referrers > /tmp/referrers.json
          gh api repos/${{ github.repository }}/traffic/popular/paths > /tmp/paths.json
          gh api repos/${{ github.repository }} --jq '{stars: .stargazers_count, forks: .forks_count, watchers: .subscribers_count}' > /tmp/repo.json

          # Append to cumulative log (one JSON object per collection run)
          echo "{\"date\":\"$DATE\",\"views\":$(cat /tmp/views.json),\"clones\":$(cat /tmp/clones.json),\"referrers\":$(cat /tmp/referrers.json),\"paths\":$(cat /tmp/paths.json),\"repo\":$(cat /tmp/repo.json)}" >> stats/traffic.jsonl

          echo "Collected traffic for $DATE"
          echo "Views: $(jq .count /tmp/views.json) ($(jq .uniques /tmp/views.json) unique)"
          echo "Clones: $(jq .count /tmp/clones.json) ($(jq .uniques /tmp/clones.json) unique)"

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/traffic.jsonl
          git diff --cached --quiet || git commit -m "stats: weekly traffic snapshot $(date -u +%Y-%m-%d)"
          git push
