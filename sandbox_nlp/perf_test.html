<!DOCTYPE html><html><head><meta charset="utf-8"><title>perf</title>
<script src="sql-wasm.js"></script><script src="decoder.js"></script></head><body>
<script>
// Measure the REAL per-query cost (decode + SQL via sql.js) on Hospital (63,415 elems,
// the heaviest building). This is the work the decoder adds per user query.
(async () => {
  const SQL = await initSqlJs({ locateFile: f => f });
  const db = new SQL.Database(new Uint8Array(await (await fetch('Hospital_meta.db')).arrayBuffer()));
  const exec = (sql, params) => db.exec(sql, params || []);
  const storeys = db.exec('SELECT DISTINCT storey FROM elements_meta WHERE storey IS NOT NULL')[0].values.map(v => v[0]);
  const out = [];
  const time = (q) => {
    // warm + measure median of 5
    const samples = [];
    let f;
    for (let i = 0; i < 6; i++) {
      const t0 = performance.now();
      f = BimDecoder.formatResult(BimDecoder.decode(q, { storeys }), exec, { cur: 'RM', rate: 3.91 });
      samples.push(performance.now() - t0);
    }
    samples.sort((a, b) => a - b);
    out.push(`§PERF "${q}" → ${samples[2].toFixed(2)}ms  (guids=${f.guids.length})`);
  };
  time('show me all the doors');        // 440 guids
  time('show me all the pipes');        // ~14k guids — heaviest result set
  time('total cost');                   // qto aggregate
  time('total area of walls');          // qto aggregate
  time('which floor has the most doors');
  time('doors and windows');
  out.forEach(l => console.log(l));
  console.log('§PERF_DONE jsSize=' + (BimDecoder.decode.toString().length) );
  window.__done = out.join('\n');
})();
</script></body></html>
