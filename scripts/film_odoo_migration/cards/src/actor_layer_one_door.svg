<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 400" role="img" aria-label="Every actor reaches the same engine through one door, and the engine decides" font-size="13"><defs><marker id="ac-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><rect width="760" height="400" fill="#ffffff"/><text x="24" y="32" font-size="15" font-weight="600" fill="#1b1f24">Every actor reaches the same engine through one door, and the engine decides</text><text x="88" y="66" text-anchor="middle" font-size="11.5" fill="#5b616b">Who acts</text><text x="256" y="66" text-anchor="middle" font-size="11.5" fill="#5b616b">How it arrives</text><text x="452" y="66" text-anchor="middle" font-size="11.5" fill="#5b616b">One door</text><text x="656" y="66" text-anchor="middle" font-size="11.5" fill="#5b616b">Decides</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M152 128H168"/><path d="M152 204H168"/><path d="M152 280H168"/><path d="M168 100V308"/><path d="M168 100H184" marker-end="url(#ac-arrow)"/><path d="M168 152H184" marker-end="url(#ac-arrow)"/><path d="M168 204H184" marker-end="url(#ac-arrow)"/><path d="M168 256H184" marker-end="url(#ac-arrow)"/><path d="M168 308H184" marker-end="url(#ac-arrow)"/><path d="M328 100H344"/><path d="M328 152H344"/><path d="M328 204H344"/><path d="M328 256H344"/><path d="M328 308H344"/><path d="M344 100V308"/><path d="M344 204H360" marker-end="url(#ac-arrow)"/><path d="M544 204H576" marker-end="url(#ac-arrow)"/><path d="M656 260V356H256V328" marker-end="url(#ac-arrow)"/></g><g><rect x="24" y="100" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="88" y="124" text-anchor="middle" font-weight="600" fill="#1b1f24">AI agent</text><text x="88" y="140" text-anchor="middle" font-size="11.5" fill="#5b616b">any model</text></g><g><rect x="24" y="176" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="88" y="200" text-anchor="middle" font-weight="600" fill="#1b1f24">Person</text><text x="88" y="216" text-anchor="middle" font-size="11.5" fill="#5b616b">click, mail, tap</text></g><g><rect x="24" y="252" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="88" y="276" text-anchor="middle" font-weight="600" fill="#1b1f24">Device</text><text x="88" y="292" text-anchor="middle" font-size="11.5" fill="#5b616b">scanner, sensor</text></g><g><rect x="184" y="80" width="144" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="104" text-anchor="middle" fill="#1b1f24">AI menu or script</text></g><g><rect x="184" y="132" width="144" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="156" text-anchor="middle" fill="#1b1f24">Screen click</text></g><g><rect x="184" y="184" width="144" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="208" text-anchor="middle" fill="#1b1f24">Email reply</text></g><g><rect x="184" y="236" width="144" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="260" text-anchor="middle" fill="#1b1f24">Phone tap</text></g><g><rect x="184" y="288" width="144" height="40" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="256" y="312" text-anchor="middle" fill="#1b1f24">Device event</text></g><g><rect x="360" y="156" width="184" height="96" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="372" y="180" font-weight="600" fill="#1b1f24">The one door</text><text x="372" y="198" font-size="11.5" fill="#1b1f24">1 parse: to a listed verb</text><text x="372" y="214" font-size="11.5" fill="#1b1f24">2 bind: who, or a claim</text><text x="372" y="230" font-size="11.5" fill="#1b1f24">3 reply: same channel</text></g><g><rect x="576" y="148" width="160" height="112" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/><text x="588" y="172" font-weight="600" fill="#1b1f24">The engine</text><text x="588" y="190" font-size="11.5" fill="#1b1f24">its own checks decide</text><text x="588" y="206" font-size="11.5" fill="#1b1f24">no AI inside</text><text x="588" y="222" font-size="11.5" fill="#1b1f24">pass: it stands</text><text x="588" y="238" font-size="11.5" fill="#1b1f24">new problem: undone</text></g><text x="456" y="376" text-anchor="middle" font-size="11.5" fill="#5b616b">answer and report, by the same channel</text></svg>
